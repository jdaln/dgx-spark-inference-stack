name: Request Validator Tests

on:
  pull_request:
    paths:
      - .github/workflows/validator-tests.yml
      - request-validator/**
      - shared/error-response.mjs
      - shared/models-config.mjs
  workflow_dispatch:

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run request-validator tests in container
        run: |
          # renovate: datasource=docker depName=node
          VALIDATOR_TEST_IMAGE=node:20-alpine@sha256:afdf98210b07b586eb71fa22ba2e432e058e4cd1304d31ed60888755b8c865fb

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/request-validator \
            "$VALIDATOR_TEST_IMAGE" \
            sh -lc "npm ci && npm test"
