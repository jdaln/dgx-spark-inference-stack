name: Stack Config

on:
  pull_request:
    paths:
      - .github/workflows/stack-config.yml
      - docker-compose.yml
      - compose/**
      - models.json
      - gateway.conf
      - shared/**
      - request-validator/index.js
      - waker/**
      - tools/**
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check compose against models.json
        run: bash tools/validate-stack.sh

      - name: Check the bench quality graders
        run: node tools/bench-lane.mjs --self-test

      - name: Check the weight helpers
        run: bash tools/lib/common.test.sh
