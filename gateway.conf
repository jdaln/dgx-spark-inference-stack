# /etc/nginx/conf.d/gateway.conf
# Main API gateway. All v1 traffic is routed through the request-validator service.

map $http_authorization $auth_header {
  default $http_authorization;
}

map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127.0.0.1(:[0-9]+)?$" $http_origin;
    "~^vscode-webview://.+$" $http_origin;
}

map $http_x_request_id $dgx_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map "" $waker_upstream {
  default "http://waker:18080";
}

map "" $validator_upstream {
  default "http://request-validator:18081";
}

server {
  listen 8080;

  access_log /dev/stdout;
  error_log /dev/stderr;
  client_max_body_size 64m;
  add_header X-Request-Id $dgx_request_id always;
  add_header X-DGX-Gateway "dgx-spark-inference-stack" always;

  # DNS for Docker internal hostnames
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Sane proxy defaults
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $dgx_request_id;
  proxy_set_header Authorization $auth_header;

  # nginx-generated errors (validator down, proxy timeout, body too large)
  # must return the same OpenAI error envelope as the services behind it.
  error_page 500 = @json_500;
  error_page 502 = @json_502;
  error_page 503 = @json_503;
  error_page 504 = @json_504;
  error_page 413 = @json_413;

  location @json_500 {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;
    return 500 '{"error":{"message":"Internal gateway error.","type":"api_error","param":null,"code":"internal_error"}}';
  }

  location @json_502 {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;
    return 502 '{"error":{"message":"Upstream service is unavailable.","type":"api_error","param":null,"code":"upstream_unavailable"}}';
  }

  location @json_503 {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;
    return 503 '{"error":{"message":"Service is temporarily unavailable.","type":"service_unavailable_error","param":null,"code":"service_unavailable"}}';
  }

  location @json_504 {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;
    return 504 '{"error":{"message":"Upstream service timed out.","type":"api_error","param":null,"code":"gateway_timeout"}}';
  }

  location @json_413 {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;
    return 413 '{"error":{"message":"Request body too large.","type":"invalid_request_error","param":null,"code":"request_too_large"}}';
  }

  # Health and debug endpoints
  location = /healthz { return 200 "ok\n"; }
  location ^~ /debug/ { proxy_pass $waker_upstream; }

  # Main API endpoint for all v1 traffic
  location /v1/ {
    # Add CORS headers for all responses
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Retry-After,X-Request-Id,X-DGX-Gateway,X-DGX-Busy-Container,X-DGX-Busy-Workload,X-DGX-External-GPU-Policy' always;
    add_header X-Request-Id $dgx_request_id always;
    add_header X-DGX-Gateway "dgx-spark-inference-stack" always;

    if ($request_method = 'OPTIONS') {
      return 204;
    }

    # Pass all v1 traffic to the validator/router service
    proxy_pass $validator_upstream;
  }

  # Fallback for any other requests
  location / {
    default_type application/json;
    return 404 '{"error":{"message":"Route not found.","type":"not_found_error","param":null,"code":"route_not_found"}}';
  }
}
