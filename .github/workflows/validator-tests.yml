name: Request Validator Tests

on:
  pull_request:
    paths:
      - .github/workflows/validator-tests.yml
      - request-validator/**
      - shared/error-response.mjs
      - shared/models-config.mjs
      - models.json
  workflow_dispatch:

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run request-validator tests in container
        run: |
          # renovate: datasource=docker depName=node
          VALIDATOR_TEST_IMAGE=node:20-alpine@sha256:d63c387675b0ec5d7ef0c15b03691ac9f82803a8b30c87de3ce8a16960831cbc

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/request-validator \
            "$VALIDATOR_TEST_IMAGE" \
            sh -lc "npm ci && npm test"
