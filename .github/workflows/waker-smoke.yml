name: Waker Smoke Test

on:
  pull_request:
    paths:
      - .github/workflows/waker-smoke.yml
      - waker/**
      - shared/models-config.mjs
      - shared/error-response.mjs
      - shared/workloads-config.mjs
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run waker smoke test in container
        run: |
          # renovate: datasource=docker depName=node
          WAKER_SMOKE_IMAGE=node:20-alpine@sha256:d63c387675b0ec5d7ef0c15b03691ac9f82803a8b30c87de3ce8a16960831cbc

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/waker \
            "$WAKER_SMOKE_IMAGE" \
            sh -lc "npm ci && npm test"
