x-model-common: &model-common
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: "all"
            capabilities: ["gpu"]
  shm_size: "16g"
  ulimits:
    memlock: -1
    stack: 67108864
  restart: "no"
  logging:
    driver: ${DOCKER_LOG_DRIVER:-json-file}
    options:
      max-size: "10m"
      max-file: "3"
  # No egress, no capabilities, no setuid gain; weights come from ./models (docs/security.md).
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - vllm_internal

x-model-profiled: &model-profiled
  <<: *model-common
  profiles: ["models"]

x-env-common: &env-common
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_CACHE: /models
  HF_HOME: /root/.cache/huggingface
  VLLM_API_KEY: ${VLLM_API_KEY:-63TestTOKEN0REPLACEME}
  VLLM_NO_USAGE_STATS: "1"
  VLLM_CONFIGURE_LOGGING: ${VLLM_LOGGING:-0}

x-healthcheck-default: &healthcheck-default
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 5

services:
  vllm-qwen3.8-27b-nvfp4-dflash2:
    <<: *model-profiled
    image: ${VLLM_TRACK_IMAGE_DFLASH2:-vllm-node-dflash2}
    container_name: vllm-qwen3.8-27b-nvfp4-dflash2
    command:
      - vllm
      - serve
      - --model
      - RadixArk/Qwen3.8-27B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - qwen3.8-27b-nvfp4-dflash2
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "${QWEN38_27B_NVFP4_DFLASH2_GPU_MEMORY_UTILIZATION:-0.80}"
      - --max-model-len
      - "${QWEN38_27B_NVFP4_DFLASH2_MAX_MODEL_LEN:-262144}"
      - --max-num-seqs
      - "${QWEN38_27B_NVFP4_DFLASH2_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "16384"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      # Draft depth by batch size (8/6/4) is faster under load than a flat 8.
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","revision":"50307d4c4cde6860d4eee73e2547cd786fe8e8a4","num_speculative_tokens":8,"draft_tensor_parallel_size":1,"num_speculative_tokens_per_batch_size":[[1,2,8],[3,4,6],[5,8,4]]}'
      - --load-format
      - instanttensor
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --tensor-parallel-size
      - "1"
      - --disable-uvicorn-access-log
      - --disable-log-stats
      # Validated snapshot. Re-validate before changing it.
      - --revision
      - 319f741cce68d7914884900c138a1fbb70a42f30
      - --tokenizer-revision
      - 319f741cce68d7914884900c138a1fbb70a42f30
    volumes:
      - ../cache/vllm-qwen3.8-27b-nvfp4-dflash2/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-qwen3.8-27b-nvfp4-dflash2/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-qwen3.8-27b-nvfp4-dflash2/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-qwen3.8-27b-nvfp4-dflash2/torchinductor:/tmp/torchinductor_root
    environment:
      <<: *env-common
    healthcheck:
      <<: *healthcheck-default
      start_period: 1800s

  # BF16 reference for the NVFP4 requant below, not for serving.
  vllm-huihui-qwen3.8-27b-abliterated:
    <<: *model-profiled
    image: ${VLLM_TRACK_IMAGE_DFLASH2:-vllm-node-dflash2}
    container_name: vllm-huihui-qwen3.8-27b-abliterated
    command:
      - vllm
      - serve
      - --model
      - huihui-ai/Huihui-Qwen3.8-27B-abliterated
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - huihui-qwen3.8-27b-abliterated
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "${HUIHUI_QWEN38_27B_GPU_MEMORY_UTILIZATION:-0.80}"
      - --max-model-len
      - "${HUIHUI_QWEN38_27B_MAX_MODEL_LEN:-262144}"
      - --max-num-seqs
      - "${HUIHUI_QWEN38_27B_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "16384"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","revision":"50307d4c4cde6860d4eee73e2547cd786fe8e8a4","num_speculative_tokens":8,"draft_tensor_parallel_size":1,"num_speculative_tokens_per_batch_size":[[1,2,8],[3,4,6],[5,8,4]]}'
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --tensor-parallel-size
      - "${HUIHUI_QWEN38_27B_TENSOR_PARALLEL_SIZE:-1}"
      - --disable-uvicorn-access-log
      - --disable-log-stats
      # Validated snapshot. Re-validate before changing it.
      - --revision
      - 739e3c5b89849f6c238ce1e5b70008612ae42cdd
      - --tokenizer-revision
      - 739e3c5b89849f6c238ce1e5b70008612ae42cdd
    volumes:
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated/torchinductor:/tmp/torchinductor_root
    environment:
      <<: *env-common
    healthcheck:
      <<: *healthcheck-default
      start_period: 3600s

  # Third-party NVFP4 requant of the checkpoint above.
  vllm-huihui-qwen3.8-27b-abliterated-nvfp4:
    <<: *model-profiled
    image: ${VLLM_TRACK_IMAGE_DFLASH2:-vllm-node-dflash2}
    container_name: vllm-huihui-qwen3.8-27b-abliterated-nvfp4
    command:
      - vllm
      - serve
      - --model
      - sakamakismile/Huihui-Qwen3.8-27B-abliterated-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - huihui-qwen3.8-27b-abliterated-nvfp4
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "${HUIHUI_QWEN38_27B_NVFP4_GPU_MEMORY_UTILIZATION:-0.80}"
      - --max-model-len
      - "${HUIHUI_QWEN38_27B_NVFP4_MAX_MODEL_LEN:-262144}"
      - --max-num-seqs
      - "${HUIHUI_QWEN38_27B_NVFP4_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "16384"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      # Same speculative config as the BF16 lane.
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","revision":"50307d4c4cde6860d4eee73e2547cd786fe8e8a4","num_speculative_tokens":8,"draft_tensor_parallel_size":1,"num_speculative_tokens_per_batch_size":[[1,2,8],[3,4,6],[5,8,4]]}'
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --tensor-parallel-size
      - "${HUIHUI_QWEN38_27B_NVFP4_TENSOR_PARALLEL_SIZE:-1}"
      - --disable-uvicorn-access-log
      - --disable-log-stats
      # Validated snapshot. Re-validate before changing it.
      - --revision
      - 36276309d30211d9babf72f22d1605dc2dc6357c
      - --tokenizer-revision
      - 36276309d30211d9babf72f22d1605dc2dc6357c
    volumes:
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated-nvfp4/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated-nvfp4/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated-nvfp4/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-huihui-qwen3.8-27b-abliterated-nvfp4/torchinductor:/tmp/torchinductor_root
    environment:
      <<: *env-common
    healthcheck:
      <<: *healthcheck-default
      start_period: 2400s

  vllm-qwen3.8-flash-next-nvfp4:
    <<: *model-profiled
    # The upstream helper's solo recipe flags.
    image: ${VLLM_TRACK_IMAGE_B12X:-vllm-node-b12x}
    container_name: vllm-qwen3.8-flash-next-nvfp4
    # The PLE table is read with io_uring, which Docker's default seccomp profile blocks. The
    # path is relative to the working directory: create the container from the repo root.
    security_opt:
      - no-new-privileges:true
      - seccomp=./custom-docker-containers/vllm-node-b12x/seccomp-io-uring.json
    cap_drop:
      - ALL
    networks:
      - vllm_internal
    command:
      - vllm
      - serve
      # Pinned snapshot, served by path.
      - /models/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/6c01ac378d22f6652c9f392c87700496eca8e5dc
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - qwen3.8-flash-next-nvfp4
      - --tensor-parallel-size
      - "1"
      - --pipeline-parallel-size
      - "1"
      - --mamba-cache-mode
      - align
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --dtype
      - bfloat16
      - --kv-cache-dtype
      - fp8
      - --quantization
      - modelopt_mixed
      - --block-size
      - "16"
      - --load-format
      - b12x
      - --max-model-len
      - "${QWEN38_FLASH_NEXT_MAX_MODEL_LEN:-262144}"
      - --max-num-seqs
      - "${QWEN38_FLASH_NEXT_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${QWEN38_FLASH_NEXT_MAX_NUM_BATCHED_TOKENS:-4096}"
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":4}'
      - --gdn-decode-kernel
      - b12x
      - --linear-backend
      - b12x
      - --moe-backend
      - b12x
      - --no-enable-flashinfer-autotune
      - --mm-encoder-tp-mode
      - data
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --compilation-config
      - '{"pass_config":{"fuse_act_quant":true}}'
      - --gpu-memory-utilization
      - "${QWEN38_FLASH_NEXT_GPU_MEMORY_UTILIZATION:-0.80}"
      - --disable-uvicorn-access-log
      - --disable-log-stats
    volumes:
      - ../cache/vllm-qwen3.8-flash-next-nvfp4/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-qwen3.8-flash-next-nvfp4/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-qwen3.8-flash-next-nvfp4/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-qwen3.8-flash-next-nvfp4/torchinductor:/tmp/torchinductor_root
    environment:
      <<: *env-common
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_PLE_TABLE_MEMORY: disk
      CUTE_DSL_ARCH: sm_121a
      SAFETENSORS_FAST_GPU: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: auto
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
    healthcheck:
      <<: *healthcheck-default
      start_period: 2700s
