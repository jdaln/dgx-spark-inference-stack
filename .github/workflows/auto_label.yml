name: Auto Label Issues

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    # Fork announcements are not requests for help.
    if: ${{ !contains(github.event.issue.labels.*.name, 'fork') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add "help wanted" label
        run: gh issue edit "$NUMBER" --add-label "help wanted"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
