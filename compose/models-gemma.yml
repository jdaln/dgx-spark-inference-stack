x-model-common: &model-common
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: "all"
            capabilities: ["gpu"]
  shm_size: "16g"
  ulimits:
    memlock: -1
    stack: 67108864
  restart: "no"
  logging:
    driver: ${DOCKER_LOG_DRIVER:-json-file}
    options:
      max-size: "10m"
      max-file: "3"
  # No egress, no capabilities, no setuid gain; weights come from ./models (docs/security.md).
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - vllm_internal

x-model-profiled: &model-profiled
  <<: *model-common
  profiles: ["models"]

x-env-common: &env-common
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_CACHE: /models
  HF_HOME: /root/.cache/huggingface
  VLLM_API_KEY: ${VLLM_API_KEY:-63TestTOKEN0REPLACEME}
  VLLM_NO_USAGE_STATS: "1"
  VLLM_CONFIGURE_LOGGING: ${VLLM_LOGGING:-0}

x-healthcheck-default: &healthcheck-default
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 5

services:
  vllm-gemma4-26b-a4b:
    <<: *model-profiled
    # MoE runs on FlashInfer's FP4 kernels: the b12x MoE kernels lack GELU-tanh.
    image: ${VLLM_TRACK_IMAGE_B12X:-vllm-node-b12x}
    container_name: vllm-gemma4-26b-a4b
    entrypoint: []
    command:
      - vllm
      - serve
      - nvidia/Gemma-4-26B-A4B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - gemma4-26b-a4b
      - --chat-template
      - /workspace/tool_chat_template_gemma4.jinja
      # Config copy without the fp8 KV scheme: fp8 KV breaks system turns.
      - --hf-config-path
      - /workspace/gemma4-26b-nvfp4-config
      - --max-model-len
      - "${GEMMA4_26B_A4B_MAX_MODEL_LEN:-262144}"
      # 50% still holds 2.19 full windows of KV.
      - --gpu-memory-utilization
      - "${GEMMA4_26B_A4B_GPU_MEMORY_UTILIZATION:-0.50}"
      # The full-prompt admission check stalls prompts above ~148k uncached tokens.
      - --no-scheduler-reserve-full-isl
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --kv-cache-dtype
      - auto
      - --max-num-batched-tokens
      - "${GEMMA4_26B_A4B_MAX_NUM_BATCHED_TOKENS:-8192}"
      - --tensor-parallel-size
      - "${GEMMA4_26B_A4B_TENSOR_PARALLEL_SIZE:-1}"
      # No Ray: it cannot find the node IP on the internal network.
      - --distributed-executor-backend
      - mp
      # Depth 8: deeper or load-scaled drafts were no faster.
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/gemma-4-26B-A4B-it-DFlash","revision":"77d4202772dfe50b2396ec7bac9cfffc7b9e7057","num_speculative_tokens":8}'
      # Validated snapshot. Re-validate before changing it.
      - --revision
      - a19cfe00be84568a6867111c9a68c9c44fdcffe6
      - --tokenizer-revision
      - a19cfe00be84568a6867111c9a68c9c44fdcffe6
    volumes:
      - ../cache/vllm-gemma4-26b-a4b/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-gemma4-26b-a4b/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-gemma4-26b-a4b/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-gemma4-26b-a4b/torchinductor:/tmp/torchinductor_root
      - ../shared/tool_chat_template_gemma4.jinja:/workspace/tool_chat_template_gemma4.jinja:ro
      - ../shared/gemma4-26b-nvfp4-config:/workspace/gemma4-26b-nvfp4-config:ro
    environment:
      <<: *env-common
      CUTE_DSL_ARCH: sm_121a
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      # The draft needs the V2 model runner.
      VLLM_USE_V2_MODEL_RUNNER: "1"
    healthcheck:
      <<: *healthcheck-default
      start_period: 1800s

  vllm-gemma4-31b:
    <<: *model-profiled
    # The draft's buffers limit the window to 180224 at 75%; a full window needs ~85%.
    image: ${VLLM_TRACK_IMAGE_B12X:-vllm-node-b12x}
    container_name: vllm-gemma4-31b
    entrypoint: []
    command:
      - vllm
      - serve
      # ModelOpt NVFP4 on the MLPs; attention, lm_head and vision stay BF16.
      - nvidia/Gemma-4-31B-IT-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - gemma4-31b
      - --chat-template
      - /workspace/tool_chat_template_gemma4.jinja
      - --max-model-len
      - "${GEMMA4_31B_MAX_MODEL_LEN:-180224}"
      - --gpu-memory-utilization
      - "${GEMMA4_31B_GPU_MEMORY_UTILIZATION:-0.75}"
      # Admission gate off, as on vllm-gemma4-26b-a4b.
      - --no-scheduler-reserve-full-isl
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      # Config copy without the fp8 KV scheme (the checkpoint ships no KV scales): BF16 KV.
      - --hf-config-path
      - /workspace/gemma4-31b-nvfp4-config
      - --kv-cache-dtype
      - auto
      - --max-num-batched-tokens
      - "${GEMMA4_31B_MAX_NUM_BATCHED_TOKENS:-8192}"
      - --tensor-parallel-size
      - "${GEMMA4_31B_TENSOR_PARALLEL_SIZE:-1}"
      # No Ray: it cannot find the node IP on the internal network.
      - --distributed-executor-backend
      - mp
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/gemma-4-31B-it-DFlash","revision":"eabd648301ce28583cc14757912e5e0f84e152e1","num_speculative_tokens":8}'
      # Validated snapshot. Re-validate before changing it.
      - --revision
      - 4135a98a9b728a548947683219633b25682223ac
      - --tokenizer-revision
      - 4135a98a9b728a548947683219633b25682223ac
    volumes:
      - ../cache/vllm-gemma4-31b/huggingface:/root/.cache/huggingface
      - ../models:/models:ro
      - ../cache/vllm-gemma4-31b/flashinfer:/root/.cache/flashinfer
      - ../cache/vllm-gemma4-31b/torch_extensions:/root/.cache/torch_extensions
      - ../cache/vllm-gemma4-31b/torchinductor:/tmp/torchinductor_root
      - ../shared/tool_chat_template_gemma4.jinja:/workspace/tool_chat_template_gemma4.jinja:ro
      - ../shared/gemma4-31b-nvfp4-config:/workspace/gemma4-31b-nvfp4-config:ro
    environment:
      <<: *env-common
      CUTE_DSL_ARCH: sm_121a
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      # The draft needs the V2 model runner.
      VLLM_USE_V2_MODEL_RUNNER: "1"
    healthcheck:
      <<: *healthcheck-default
      start_period: 1800s
